<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f8fb" />
    <meta name="description" content="Learn how Trivy works. Explore the scanner, Trivy Operator, vulnerability databases, misconfiguration checks, and node-collector through interactive diagrams and guided labs." />
    <title>Learn Trivy · A visual field guide</title>
    <script id="theme-init">
      (() => {
        let theme;
        try { theme = JSON.parse(localStorage.getItem('trivy-theme')); } catch {}
        if (!['light', 'dark'].includes(theme)) theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#101820' : '#f6f8fb';
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.mjs"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="app"></div>
    <dialog id="search-dialog" aria-label="Search the field guide"></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <noscript><p>This interactive guide needs JavaScript. Enable JavaScript to explore the lessons.</p></noscript>
  </body>
</html>
