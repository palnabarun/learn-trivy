apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: trivy-learning
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
    spec:
      containers:
        - name: api
          image: alpine:3.20
          command: ["sleep", "3600"]
        - name: sidecar
          image: busybox:1.36
          command: ["sleep", "3600"]
